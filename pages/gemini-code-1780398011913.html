<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>科举诗句连连看</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* 防止拖拽时选中文本 */
        }

        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "KaiTi", "楷体", serif;
        }

        #game-container {
            width: 640px;
            height: 1252px;
            background-color: transparent; /* 您要求的透明底色 */
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 顶部标题与计分区 */
        .header {
            text-align: center;
            color: #fff;
            padding: 40px 20px 20px;
            z-index: 10;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 15px;
            letter-spacing: 5px;
            color: #e6b36a;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header h3 {
            font-size: 20px;
            font-weight: normal;
            margin-bottom: 25px;
            color: #ccc;
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 50px;
            font-size: 24px;
            color: #fff;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
            width: 80%;
            margin: 0 auto;
        }
        
        .score-val {
            color: #e6b36a;
            font-weight: bold;
            font-size: 28px;
        }

        /* 游戏主体区域 */
        .board {
            flex: 1;
            display: flex;
            justify-content: space-between;
            padding: 20px 10px 60px;
            position: relative;
        }

        /* 左右列容器 */
        .column {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            z-index: 10;
        }

        .left-col { align-items: flex-start; margin-left: 15px;}
        .right-col { align-items: flex-end; margin-right: 15px;}

        /* 卡片通用样式 */
        .card {
            position: relative;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* 左侧诗句卡片样式 */
        .card-left {
            width: 260px;
            min-height: 120px;
            background-color: #f5eedc; /* 米黄色背景 */
            border: 2px solid #b37e62;
            padding: 15px;
            font-size: 20px;
            line-height: 1.6;
            color: #1a1a1a;
            font-weight: bold;
            border-style: double;
            border-width: 6px;
        }

        /* 右侧情绪卡片样式 */
        .card-right {
            width: 220px;
            height: 70px;
            background: linear-gradient(to right, #9c3c1e, #b84b29); /* 红棕色 */
            border: 4px solid #4a7c59; /* 绿色边框 */
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        /* 连接点 (锚点) */
        .dot {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #e6b36a;
            border: 3px solid #fff;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
            z-index: 20;
            transition: transform 0.2s;
        }
        
        .dot:hover {
            transform: scale(1.3);
            background-color: #ffeb3b;
        }

        .left-col .dot {
            right: -25px;
            top: 50%;
            transform: translateY(-50%);
        }

        .right-col .dot {
            left: -25px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* 画布 */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none; /* 让鼠标事件穿透画布 */
        }
    </style>
</head>
<body>

<div id="game-container">
    <div class="header">
        <h1>连连看</h1>
        <h3>请将古代考生科举主题诗句与对应情绪连线</h3>
        <div class="scoreboard">
            <div>连接数: <span id="conn-count" class="score-val">0</span> / 5</div>
            <div>正确数: <span id="correct-count" class="score-val">0</span> / 5</div>
        </div>
    </div>

    <div class="board">
        <canvas id="line-canvas" width="640" height="1030"></canvas>
        
        <!-- 左侧诗句 -->
        <div class="column left-col" id="left-col">
            <div class="card card-left" data-index="0">万人被黜落，道路涕纷纷。旋里无颜色，志士死不存。<div class="dot"></div></div>
            <div class="card card-left" data-index="1">得意疾书，回头大错，此况何如！觉千瓢冷汗沾衣，一缕魂飞出舍，痛痒全无。<div class="dot"></div></div>
            <div class="card card-left" data-index="2">十有九人堪白眼，百无一用是书生。<div class="dot"></div></div>
            <div class="card card-left" data-index="3">羡君占尽科名荣，一日声华漫天地。<div class="dot"></div></div>
            <div class="card card-left" data-index="4">落拓名场五十秋，不成一事雪盈头。<div class="dot"></div></div>
        </div>

        <!-- 右侧情绪 -->
        <div class="column right-col" id="right-col">
            <div class="card card-right" data-index="0">未中举的失落<div class="dot"></div></div>
            <div class="card card-right" data-index="1">中举的喜悦<div class="dot"></div></div>
            <div class="card card-right" data-index="2">考场内的紧张<div class="dot"></div></div>
            <div class="card card-right" data-index="3">未中举的愤懑<div class="dot"></div></div>
            <div class="card card-right" data-index="4">对科举的焦虑<div class="dot"></div></div>
        </div>
    </div>
</div>

<script>
    // 题目答案映射配置 (左侧索引 -> 右侧索引)
    // 左1(0)->右4(3), 左2(1)->右3(2), 左3(2)->右5(4), 左4(3)->右2(1), 左5(4)->右1(0)
    const correctMap = {
        0: 3, 
        1: 2, 
        2: 4, 
        3: 1, 
        4: 0  
    };

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('line-canvas');
    const ctx = canvas.getContext('2d');
    
    const leftCards = document.querySelectorAll('.left-col .card');
    const rightCards = document.querySelectorAll('.right-col .card');
    const connCountEl = document.getElementById('conn-count');
    const correctCountEl = document.getElementById('correct-count');

    // 存储已经连接的线
    let lines = []; 
    // 当前正在拖拽的状态
    let isDrawing = false;
    let currentLine = null;
    
    // 吸附距离阈值
    const SNAP_DISTANCE = 60; 

    // 获取圆点的中心坐标（相对于Canvas）
    function getDotCenter(cardEl) {
        const dot = cardEl.querySelector('.dot');
        const dotRect = dot.getBoundingClientRect();
        const canvasRect = canvas.getBoundingClientRect();
        return {
            x: dotRect.left - canvasRect.left + dotRect.width / 2,
            y: dotRect.top - canvasRect.top + dotRect.height / 2
        };
    }

    // 更新画布大小和重绘
    function resizeCanvas() {
        const board = document.querySelector('.board');
        canvas.width = board.clientWidth;
        canvas.height = board.clientHeight;
        drawLines();
    }
    
    // 绘制所有线条
    function drawLines() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 绘制已固定的线
        lines.forEach(line => {
            drawLine(line.startX, line.startY, line.endX, line.endY, line.isCorrect ? '#4CAF50' : '#F44336');
        });

        // 绘制当前正在拖拽的线
        if (isDrawing && currentLine) {
            drawLine(currentLine.startX, currentLine.startY, currentLine.endX, currentLine.endY, '#e6b36a');
        }
    }

    // 基础画线函数
    function drawLine(x1, y1, x2, y2, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();
        
        // 画两端的小圆点增强视觉效果
        ctx.beginPath();
        ctx.arc(x1, y1, 6, 0, Math.PI * 2);
        ctx.arc(x2, y2, 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
    }

    // 更新计分板
    function updateScore() {
        connCountEl.innerText = lines.length;
        const correctCount = lines.filter(l => l.isCorrect).length;
        correctCountEl.innerText = correctCount;
        
        if(correctCount === 5) {
            setTimeout(() => {
                alert("恭喜您！全部连线正确！");
            }, 300);
        }
    }

    // 处理开始拖拽（兼容鼠标和触摸）
    function handleStart(e, index, isLeft) {
        // 如果该点已经连过线，则先删除旧线
        lines = lines.filter(l => isLeft ? l.leftIndex !== index : l.rightIndex !== index);
        updateScore();

        const card = isLeft ? leftCards[index] : rightCards[index];
        const startPos = getDotCenter(card);
        
        isDrawing = true;
        currentLine = {
            startX: startPos.x,
            startY: startPos.y,
            endX: startPos.x,
            endY: startPos.y,
            leftIndex: isLeft ? index : null,
            rightIndex: !isLeft ? index : null,
            isStartingFromLeft: isLeft
        };
        drawLines();
    }

    // 处理拖拽中
    function handleMove(e) {
        if (!isDrawing) return;
        e.preventDefault(); // 防止屏幕滚动
        
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        
        const canvasRect = canvas.getBoundingClientRect();
        currentLine.endX = clientX - canvasRect.left;
        currentLine.endY = clientY - canvasRect.top;
        
        drawLines();
    }

    // 处理拖拽结束
    function handleEnd(e) {
        if (!isDrawing) return;
        isDrawing = false;

        // 查找是否靠近目标点
        let targetCards = currentLine.isStartingFromLeft ? rightCards : leftCards;
        let snapped = false;

        for (let i = 0; i < targetCards.length; i++) {
            const targetPos = getDotCenter(targetCards[i]);
            // 计算距离
            const dist = Math.hypot(currentLine.endX - targetPos.x, currentLine.endY - targetPos.y);
            
            // 如果在吸附范围内
            if (dist < SNAP_DISTANCE) {
                // 判断此目标是否已被连接过，如果是，覆盖它
                lines = lines.filter(l => currentLine.isStartingFromLeft ? l.rightIndex !== i : l.leftIndex !== i);

                currentLine.endX = targetPos.x;
                currentLine.endY = targetPos.y;
                
                if (currentLine.isStartingFromLeft) {
                    currentLine.rightIndex = i;
                } else {
                    currentLine.leftIndex = i;
                }
                
                // 校验正确性
                currentLine.isCorrect = (correctMap[currentLine.leftIndex] === currentLine.rightIndex);
                
                // 为了视觉上总是从左到右绘制，规范化坐标
                const leftPos = getDotCenter(leftCards[currentLine.leftIndex]);
                const rightPos = getDotCenter(rightCards[currentLine.rightIndex]);
                currentLine.startX = leftPos.x;
                currentLine.startY = leftPos.y;
                currentLine.endX = rightPos.x;
                currentLine.endY = rightPos.y;

                lines.push({...currentLine});
                snapped = true;
                break;
            }
        }

        currentLine = null;
        updateScore();
        drawLines();
    }

    // 绑定事件
    leftCards.forEach((card, index) => {
        const dot = card.querySelector('.dot');
        dot.addEventListener('mousedown', (e) => handleStart(e, index, true));
        dot.addEventListener('touchstart', (e) => handleStart(e, index, true), {passive: false});
    });

    rightCards.forEach((card, index) => {
        const dot = card.querySelector('.dot');
        dot.addEventListener('mousedown', (e) => handleStart(e, index, false));
        dot.addEventListener('touchstart', (e) => handleStart(e, index, false), {passive: false});
    });

    // 绑定全局移动和抬起事件
    document.addEventListener('mousemove', handleMove);
    document.addEventListener('touchmove', handleMove, {passive: false});
    document.addEventListener('mouseup', handleEnd);
    document.addEventListener('touchend', handleEnd);

    // 初始化画布
    window.onload = resizeCanvas;
    window.onresize = resizeCanvas;

</script>
</body>
</html>

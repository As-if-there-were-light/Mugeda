<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试抽签交互</title>
    <style>
        /* 页面基础样式 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee9df;
            overflow: hidden;
            font-family: sans-serif;
        }

        /* 主容器：响应式适配 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 640px;
            max-height: 1252px;
            aspect-ratio: 640 / 1252;
            overflow: hidden;
            background-color: #eee9df; /* 确保容器内也是米色 */
        }

        /* 抽签桶 (图1的主体部分) - 改为百分比自适应 */
        .stick-can {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 65%; /* 替代原来的固宽 420px */
            min-height: 200px; /* 防止图片未加载时高度塌陷 */
            object-fit: contain;
            cursor: pointer;
            z-index: 2;
            transition: transform 0.1s ease;
        }

        /* 抽签桶摇晃动画类 */
        .shake-animation {
            animation: shake 1.5s ease-in-out forwards;
        }

        /* 抽签结果牌容器 - 改为百分比自适应 */
        .lottery-card-container {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%) scale(0.1); 
            width: 50%; /* 替代原来的固宽 320px */
            height: 45%; /* 替代原来的固高 560px */
            perspective: 1000px; 
            z-index: 1; 
            opacity: 0;
            pointer-events: none;
            transition: transform 0.5s ease-out, opacity 0.5s ease-out, z-index 0s linear 0.5s; 
        }

        /* 显示结果牌时的样式 - 弹出高度改为百分比 */
        .lottery-card-container.show {
            transform: translateX(-50%) scale(1) translateY(-15%); /* 替代原来的 -60px */
            opacity: 1;
            z-index: 5; 
            transition: transform 0.5s ease-out, opacity 0.5s ease-out, z-index 0s linear; 
        }

        /* 3D 翻转的卡片主体 */
        .lottery-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55); 
        }

        /* 翻转状态 */
        .lottery-card.flipped {
            transform: rotateY(180deg);
        }

        /* 卡片的正反两面 */
        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden; 
            background-position: center;
            background-size: contain;
            background-repeat: no-repeat;
            border-radius: 12px; 
            /* 新增保底底色：如果图片没加载出来，至少能看到白色的卡片在翻转 */
            background-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* ======= 路径严格保持不变 ======= */
        .card-front { background-image: url('image_1.png'); }
        .card-back {
            transform: rotateY(180deg); 
            background-image: none; 
        }

        /* 分享文本 */
        .blessing-text {
            position: absolute;
            top: 58%; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            text-align: center;
            font-size: 20px; /* 稍微缩小以防文字折行 */
            color: #c0392b;
            font-weight: bold;
            opacity: 0; 
            z-index: 6;
            transition: opacity 0.5s ease;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
            pointer-events: none;
        }

        .blessing-text.show {
            opacity: 1;
        }

        /* 按钮组 */
        .btn-group {
            position: absolute;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px; 
            z-index: 10;
            width: 90%;
            justify-content: center;
        }

        .action-btn {
            padding: 12px 25px;
            font-size: 18px;
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .action-btn:disabled {
            background-color: #95a5a6 !important;
            cursor: not-allowed;
            box-shadow: none;
        }

        .draw-btn { background-color: #c0392b; }
        .draw-btn:hover:not(:disabled) { background-color: #e74c3c; transform: scale(1.05); }

        .share-btn {
            background-color: #07c160; 
            display: none; 
        }
        .share-btn:hover { background-color: #06ad56; transform: scale(1.05); }

        /* 微信分享引导遮罩 */
        .share-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 999;
            display: none; 
            flex-direction: column;
            align-items: flex-end;
            padding: 30px 40px;
            box-sizing: border-box;
            color: white;
            font-size: 20px;
            line-height: 1.6;
            text-align: right;
            cursor: pointer; 
        }

        .share-overlay.show { display: flex; }

        .share-arrow {
            font-size: 50px;
            margin-bottom: 10px;
            margin-right: 15px;
            transform: rotate(-45deg); 
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: rotate(-45deg) translate(0, 0); }
            to { transform: rotate(-45deg) translate(10px, -10px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(-50%) rotate(0deg); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-50%) translateY(-5px) rotate(-5deg); }
            20%, 40%, 60%, 80% { transform: translateX(-50%) translateY(5px) rotate(5deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="image_0.png" alt="抽签桶" class="stick-can" id="stickCan">

        <div class="lottery-card-container" id="cardContainer">
            <div class="lottery-card" id="lotteryCard">
                <div class="card-front"></div>
                <div class="card-back" id="cardBack"></div>
            </div>
        </div>

        <div class="blessing-text" id="blessingText">将我的大考好运传递给你～ 🍀</div>

        <div class="btn-group">
            <button class="action-btn draw-btn" id="drawBtn">点击抽取考试签</button>
            <button class="action-btn share-btn" id="shareBtn">分享好运</button>
        </div>

        <div class="share-overlay" id="shareOverlay">
            <div class="share-arrow">↑</div>
            <div>点击右上角 <strong>···</strong></div>
            <div>将大考好运传递给朋友吧～</div>
        </div>
    </div>

    <script>
        const stickCan = document.getElementById('stickCan');
        const drawBtn = document.getElementById('drawBtn');
        const shareBtn = document.getElementById('shareBtn');
        const cardContainer = document.getElementById('cardContainer');
        const lotteryCard = document.getElementById('lotteryCard');
        const cardBack = document.getElementById('cardBack');
        const blessingText = document.getElementById('blessingText');
        const shareOverlay = document.getElementById('shareOverlay');

        // ======= 路径严格保持不变 =======
        const results = [
            'image_2.png', 'image_3.png', 'image_4.png', 'image_5.png', 'image_6.png'  
        ];

        let canDraw = true;

        drawBtn.addEventListener('click', () => {
            if (!canDraw) return;
            canDraw = false;
            
            drawBtn.disabled = true;
            drawBtn.innerText = '正在抽签...';
            shareBtn.style.display = 'none';
            blessingText.classList.remove('show');

            cardContainer.classList.remove('show');
            lotteryCard.classList.remove('flipped');
            cardBack.style.backgroundImage = 'none';

            stickCan.classList.add('shake-animation');

            setTimeout(() => {
                cardContainer.classList.add('show');
            }, 1000); 

            setTimeout(() => {
                stickCan.classList.remove('shake-animation');
            }, 1500); 

            setTimeout(() => {
                const randomIndex = Math.floor(Math.random() * results.length);
                cardBack.style.backgroundImage = `url('${results[randomIndex]}')`;

                lotteryCard.classList.add('flipped');

                setTimeout(() => {
                    drawBtn.innerText = '再次抽取';
                    drawBtn.disabled = false;
                    canDraw = true;
                    
                    shareBtn.style.display = 'block';
                    blessingText.classList.add('show');
                }, 1500); 

            }, 2500); 
        });

        shareBtn.addEventListener('click', () => {
            shareOverlay.classList.add('show');
        });

        shareOverlay.addEventListener('click', () => {
            shareOverlay.classList.remove('show');
        });
    </script>
</body>
</html>
